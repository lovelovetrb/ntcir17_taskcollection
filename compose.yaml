services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: ntcir17-taskcollection:dev
    working_dir: /work
    volumes:
      - .:/work
      - /work/.venv   # ホストの .venv を隠す (コンテナ側は /opt/venv)
      - ${NTCIR_DATA_DIR:-${HOME}/dev/dataset/ntcir17}:/data/ntcir:ro
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      - uv-cache:/root/.cache/uv
    environment:
      NTCIR_DATA_DIR: /data/ntcir
      HF_HOME: /root/.cache/huggingface
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: "16gb"
    stdin_open: true
    tty: true

  viewer:
    build:
      context: .
      dockerfile: Dockerfile.viewer
    image: ntcir17-taskcollection:viewer
    ports:
      - "${LAYER_INSPECTOR_PORT:-5955}:5955"
    volumes:
      # 結果ファイルには NTCIR の文書本文が入るため、イメージに入れず読み取り専用でマウントする
      - ${LAYER_INSPECTOR_RESULT_FILE:-./results/cl-tohoku/bert-base-japanese-v3/layer-inspector/inspection.json}:/data/inspection.json:ro

volumes:
  uv-cache:
